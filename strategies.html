<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta http-equiv="refresh" content="300">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gordon — Strategies</title>
  <link rel="icon" href="assets/gordon-logo.svg">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-brand"><img src="assets/gordon-logo.svg" alt="G">gordon.money</a>
    <div class="nav-links">
      <a href="index.html">Overview</a>
      <a href="strategies.html" class="active">Strategies</a>
      <a href="predictions.html">Predictions</a>
      <a href="signals.html">Signals</a>
      <a href="worldview.html">Worldview</a>
      <a href="polymarket.html">Polymarket</a>
    </div>
      <span class="timestamp" id="refreshCountdown" style="margin-left:auto;padding-right:16px;color:var(--text-dim,#888);font-size:0.75rem"></span>
  </nav>
  <div class="container" id="content"><div class="loading">Loading strategies</div></div>
  <footer class="footer">Powered by Gordon 💰 | Data updates every 12h | Not financial advice</footer>
  <script src="assets/charts.js"></script>
  <script>
fetch('data/dashboard.json?t='+Date.now()).then(r=>r.json()).then(data=>{
  console.log('Dashboard data:', data);
  try {
  const strats=data.strategies||{};
  const c=document.getElementById('content');

  function stratCard(key,s){
    if(!s) return '';
    const color=(s.total_pnl||0)>=0?'var(--green)':'var(--red)';
    return `<div class="card">
      <div class="card-title">${stratBadge(s.name||key)} Strategy <span style="font-size:0.75rem;color:var(--text-dim)">(${s.environment||'unknown'})</span></div>
      <div class="grid grid-3" style="margin-top:12px">
        <div><div class="card-label">Total Trades</div><div style="font-size:1.4rem;font-weight:700">${s.total_trades||0}</div></div>
        <div><div class="card-label">Win Rate</div><div style="font-size:1.4rem;font-weight:700;color:${(s.win_rate||0)>=55?'var(--green)':'var(--text-dim)'}">${(s.winning_trades||0)+(s.losing_trades||0)>0 ? (s.win_rate||0)+'%' : '—'}</div></div>
        <div><div class="card-label">Total P&L</div><div style="font-size:1.4rem;font-weight:700;color:${color}">${fmt$(s.total_pnl||0)}</div></div>
        <div><div class="card-label">Sharpe Ratio</div><div style="font-size:1.2rem;font-weight:600">${s.sharpe_ratio!=null ? s.sharpe_ratio.toFixed(2) : '—'}</div></div>
        <div><div class="card-label">Max Drawdown</div><div style="font-size:1.2rem;font-weight:600;color:var(--red)">${s.max_drawdown!=null ? s.max_drawdown+'%' : '—'}</div></div>
        <div><div class="card-label">Open Positions</div><div style="font-size:1.2rem;font-weight:600">${s.open_positions||0}</div></div>
      </div>
    </div>`;
  }

  const pnlHistory = strats.pnl_history || [];

  const alloc = data.daily_allocation || {};
  const allocPositions = alloc.open_positions || alloc.positions || [];
  const allocStats = alloc.summary || {
    total_positions: allocPositions.length,
    total_invested: allocPositions.reduce((s,p)=>s+(p.size_usd||0),0),
    avg_leverage: allocPositions.length ? allocPositions.reduce((s,p)=>s+(p.leverage||1),0)/allocPositions.length : 1,
    regime: allocPositions[0]?.regime || '—'
  };

  c.innerHTML=`
  ${allocPositions.length > 0 ? `<div class="card" style="margin-bottom:20px">
    <div class="card-title">📊 Daily Allocation Engine <span style="font-size:0.75rem;color:var(--text-dim)">(eToro Demo)</span></div>
    <div class="grid grid-4" style="margin:12px 0">
      <div><div class="card-label">Positions</div><div style="font-size:1.4rem;font-weight:700">${allocStats.total_positions||allocPositions.length}</div></div>
      <div><div class="card-label">Total Invested</div><div style="font-size:1.4rem;font-weight:700">$${(allocStats.total_invested||0).toLocaleString()}</div></div>
      <div><div class="card-label">Avg Leverage</div><div style="font-size:1.4rem;font-weight:700">${(allocStats.avg_leverage||1).toFixed(1)}x</div></div>
      <div><div class="card-label">Regime</div><div style="font-size:1rem;font-weight:700;color:${(allocStats.regime||'').includes('DOWN')?'var(--red)':allocStats.regime==='CRISIS'?'#ff4444':'var(--green)'}">${allocStats.regime||'—'}</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Instrument</th><th>Direction</th><th>Size</th><th>Leverage</th><th>Score</th><th>Date</th></tr></thead>
      <tbody>${allocPositions.map(p=>`<tr>
        <td><strong>${p.instrument}</strong></td>
        <td>${dirBadge(p.direction)}</td>
        <td>$${(p.size_usd||0).toLocaleString()}</td>
        <td>${(p.leverage||1)}x</td>
        <td style="color:${(p.composite_score||p.score||0)>=85?'var(--green)':(p.composite_score||p.score||0)>=70?'var(--gold,#d4af37)':'var(--text-dim)'}">${(p.composite_score||p.score||0).toFixed(1)}</td>
        <td class="timestamp">${p.date||'—'}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>` : ''}
  <div class="grid grid-2" style="margin-bottom:20px">
    ${stratCard('gekko',strats.gekko)}
    ${stratCard('buffett',strats.buffett)}
  </div>
  ${pnlHistory.length > 1 ? `<div class="card" style="margin-bottom:20px">
    <div class="card-title">Cumulative P&L Over Time</div>
    <div class="chart-container" style="height:300px"><canvas id="pnlChart"></canvas></div>
  </div>` : ''}
  <div class="card" style="margin-bottom:20px">
    <div class="card-title">Trade History</div>
    <div class="table-wrap"><table id="tradeTable">
      <thead><tr><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>P&L ($)</th><th>P&L (%)</th><th>Strategy</th><th>Date</th></tr></thead>
      <tbody>${(data.recent_trades||[]).map(t=>`<tr>
        <td><strong>${t.symbol}</strong></td><td>${dirBadge(t.side||t.direction||'—')}</td>
        <td>${fmt$(t.entry_price)}</td><td>${t.exit_price?fmt$(t.exit_price):'—'}</td>
        <td class="${pnlClass(t.pnl)}">${t.pnl!=null?fmt$(t.pnl):'—'}</td>
        <td class="${pnlClass(t.pnl_pct)}">${t.pnl_pct!=null?fmtPct(t.pnl_pct):'—'}</td>
        <td>${stratBadge(t.strategy||'—')}</td><td class="timestamp">${fmtDate(t.entry_time||t.opened_at)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;

  // simple sort
  document.querySelectorAll('#tradeTable th').forEach(th=>{
    th.addEventListener('click',()=>{
      const tbody=document.querySelector('#tradeTable tbody');
      const rows=[...tbody.rows];
      const idx=th.cellIndex;
      const asc=!th.classList.contains('sorted-asc');
      document.querySelectorAll('#tradeTable th').forEach(h=>{h.classList.remove('sorted-asc','sorted-desc')});
      th.classList.add(asc?'sorted-asc':'sorted-desc');
      rows.sort((a,b)=>{
        let av=a.cells[idx].textContent, bv=b.cells[idx].textContent;
        const an=parseFloat(av.replace(/[$,%+]/g,'')), bn=parseFloat(bv.replace(/[$,%+]/g,''));
        if(!isNaN(an)&&!isNaN(bn)) return asc?an-bn:bn-an;
        return asc?av.localeCompare(bv):bv.localeCompare(av);
      });
      rows.forEach(r=>tbody.appendChild(r));
    });
  });

  // P&L history chart
  if(pnlHistory.length > 1 && document.getElementById('pnlChart')) {
    renderLineChart('pnlChart',
      pnlHistory.map(h=>h.date.slice(5)),
      [
        {label:'Gekko P&L', data:pnlHistory.map(h=>h.gekko_pnl||0), color:COLORS.gold, fill:false},
        {label:'Buffett P&L', data:pnlHistory.map(h=>h.buffett_pnl||0), color:COLORS.green||'#4caf50', fill:false}
      ]
    );
  }
  } catch(e) {
    console.error('Strategies render error:', e);
    document.getElementById('content').innerHTML='<div class="loading">Error: '+e.message+'</div>';
  }
}).catch(e=>{console.error('Fetch error:',e);document.getElementById('content').innerHTML='<div class="loading">Failed to load data</div>';});
  </script>

<script>
// Auto-refresh countdown
(function(){
  var total=300, left=total;
  var el=document.getElementById('refreshCountdown');
  if(!el) return;
  setInterval(function(){
    left--;
    if(left<0) left=0;
    var m=Math.floor(left/60), s=left%60;
    el.textContent='Next refresh in '+m+'m '+s+'s';
  },1000);
})();
</script>
</body>
</html>
